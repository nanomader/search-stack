name: Build desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Test Electron (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Test Electron (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence-${{ matrix.target }}
          path: output/playwright/
      - run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: search-stack-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
